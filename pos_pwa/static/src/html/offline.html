<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POS - Offline</title>
    <style>
      body {
        background: #222;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }
      .container {
        max-width: 400px;
        padding: 2rem;
      }
      h1 {
        color: #714b67;
        font-size: 1.5rem;
      }
      p {
        color: #aaa;
        line-height: 1.6;
      }
      button {
        background: #714b67;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 1rem;
      }
      button:hover {
        background: #8b5e7e;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>POS Offline</h1>
      <p>
        You are currently offline. Please check your internet connection and try again.
      </p>
      <p>
        If you have previously opened the POS, it should load from cache automatically.
      </p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
